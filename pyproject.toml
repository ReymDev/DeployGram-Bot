[project]
name = "deploygram"
version = "1.0.0"
description = "Telegram platform for hosting Python projects"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.12.0",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "docker>=7.0.0",
    "apscheduler>=3.10.4",
    "aiohttp>=3.9.0",
    "gitpython>=3.1.43",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
async_generators = true
